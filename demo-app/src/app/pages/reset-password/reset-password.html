<p>reset-password works!</p>
<h2>Reset Password</h2>

<input
  type="email"
  [(ngModel)]="email"
  placeholder="Email"
/>

<br><br>

<input
  type="text"
  [(ngModel)]="code"
  placeholder="Reset code"
/>

<br><br>

<input
  type="password"
  [(ngModel)]="newPassword"
  placeholder="New password"
/>

<br><br>

<button (click)="resetPassword()">
  Reset Password
</button>
